<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Projet</title>
</head>
<body>
    <div>
        <h2>Détails du Projet</h2>
        <p><strong>ID:</strong> <span id="id"></span></p>
        <p><strong>Nom:</strong> <span id="nom"></span></p>
        <p><strong>Description:</strong> <span id="description"></span></p>
        <p><strong>Date de Début:</strong> <span id="dateDebut"></span></p>
        <p><strong>Date de Fin:</strong> <span id="dateFin"></span></p>
        <p><strong>Statut:</strong> <span id="statut"></span></p>
    </div>

    <script>
        // Données du projet (à remplacer par vos données réelles)
        Projet projet = (Projet) request.getAttribute("projet")
        // Remplir les éléments HTML avec les données du projet
        document.getElementById('id').innerText = projet.id;
        document.getElementById('nom').innerText = projet.nom;
        document.getElementById('description').innerText = projet.description;
        document.getElementById('dateDebut').innerText = projet.dateDebut;
        document.getElementById('dateFin').innerText = projet.dateFin;
        document.getElementById('statut').innerText = projet.statut;
    </script>
</body>
</html>
