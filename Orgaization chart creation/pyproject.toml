[project]
name = "projet-red"
version = "0.1.0"
description = "Outil de génération d'organigramme à partir de texte"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "spacy>=3.7.0",
    "networkx>=3.0",
    "openai>=1.93.2",
]

[project.scripts]
organigramme = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
